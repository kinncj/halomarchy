[Service]
# Flash attention improved prefill 60 -> 122 tok/s on gfx1151.
# Generation is memory-bandwidth-bound (~18 tok/s for a dense 27B) and unaffected.
Environment=OLLAMA_FLASH_ATTENTION=1
Environment=OLLAMA_KV_CACHE_TYPE=q8_0
# Default context is sized from VRAM and can reserve 40GB+ for a 4B model.
Environment=OLLAMA_CONTEXT_LENGTH=8192
Environment=PATH=/opt/rocm/bin:/usr/local/sbin:/usr/local/bin:/usr/bin
